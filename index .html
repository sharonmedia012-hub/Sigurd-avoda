<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מגוון</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"><\/script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"><\/script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#fff;color:#1E293B;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;}
#pw-screen{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;}
#pw-screen.hidden{display:none;}
.pw-box{background:#F8FAFC;border-radius:20px;padding:32px 24px;width:100%;max-width:360px;border:1px solid #E2E8F0;box-shadow:0 10px 40px rgba(0,0,0,.1);text-align:center;}
.pw-sub{font-size:13px;color:#64748B;margin-bottom:24px;line-height:1.6;}
.pw-input{width:100%;padding:14px;border-radius:12px;border:2px solid #E2E8F0;background:#fff;font-size:20px;font-family:inherit;outline:none;margin-bottom:12px;text-align:center;letter-spacing:4px;}
.pw-input:focus{border-color:#3B82F6;}
.pw-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#3B82F6;color:#fff;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;}
.pw-error{color:#EF4444;font-size:12px;font-weight:600;margin-top:8px;display:none;}
#home-screen{position:fixed;inset:0;background:#F8FAFC;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:900;padding:24px;}
#home-screen.open{display:flex;}
.home-card{background:#fff;border-radius:18px;padding:22px 20px;border:1px solid #E2E8F0;box-shadow:0 4px 20px rgba(0,0,0,.08);cursor:pointer;display:flex;align-items:center;gap:16px;width:100%;max-width:380px;margin-bottom:14px;transition:transform .15s;}
.home-card:active{transform:scale(.97);}
.home-card-icon{font-size:36px;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.home-card-title{font-size:17px;font-weight:800;color:#1E293B;margin-bottom:2px;}
.home-card-desc{font-size:12px;color:#64748B;}
.home-logout{margin-top:16px;font-size:13px;color:#94A3B8;cursor:pointer;text-decoration:underline;}
#schedule-app{display:none;position:fixed;inset:0;background:#fff;z-index:800;overflow-y:auto;}
#factory-app{display:none;position:fixed;inset:0;background:#fff;z-index:800;overflow:hidden;}
#topbar{background:#fff;border-bottom:2px solid #000;padding:10px 14px;position:sticky;top:0;z-index:100;}
#topbar-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
#sync-ind{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:#F1F5F9;color:#64748B;}
#topbar-sub{font-size:11px;color:#64748B;margin-top:2px;}
#topbar-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.nb{background:#F1F5F9;border:1px solid #E2E8F0;color:#334155;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.nb.act{background:#3B82F6;border-color:#3B82F6;color:#fff;}
#save-btn{padding:7px 16px;border-radius:8px;border:none;background:#3B82F6;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;}
#cal-wrap{overflow-x:auto;padding:0 0 60px;}
#cal{min-width:560px;}
#day-headers{display:grid;grid-template-columns:50px repeat(6,1fr);border-bottom:2px solid #000;}
.dh{text-align:center;padding:10px 4px 8px;border-left:1px solid #000;}
.dh:first-child{border-left:none;}
.dn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:800;}
.dn.today{background:#3B82F6;color:#fff;}
#time-grid{display:grid;grid-template-columns:50px repeat(6,1fr);}
.dc{position:relative;border-left:1px solid #000;}
.dc0{background:rgba(239,246,255,.5);}.dc1{background:rgba(240,253,244,.5);}
.dc2{background:rgba(255,251,235,.5);}.dc3{background:rgba(255,241,242,.5);}
.dc4{background:rgba(245,243,255,.5);}.dc5{background:rgba(255,247,237,.5);}
.dc.tdc{background:rgba(59,130,246,.05)!important;}
.hr{position:absolute;left:0;right:0;border-top:1px solid #000;}
.hl{position:absolute;right:4px;font-size:12px;font-weight:700;width:46px;text-align:left;}
.htap{position:absolute;left:1px;right:1px;z-index:1;cursor:pointer;}
.htap:active{background:rgba(59,130,246,.1)!important;}
.nlx{position:absolute;left:0;right:0;height:2px;background:#EF4444;z-index:15;pointer-events:none;}
.nld{position:absolute;left:-4px;width:10px;height:10px;background:#EF4444;border-radius:50%;top:-4px;}
.tb{position:absolute;border-radius:7px;padding:3px 7px 3px 26px;cursor:pointer;z-index:10;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.tb.done{opacity:.5;}.tb.done .tt{text-decoration:line-through;}
.tt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.te{font-size:12px;color:#475569;}.tm{font-size:11px;color:#64748B;}
.db{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:5px;border:1.5px solid rgba(0,0,0,.2);background:rgba(255,255,255,.7);font-size:9px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;padding:0;line-height:1;}
.db.chk{background:#10B981;border-color:#10B981;color:#fff;font-size:12px;}
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center;}
#mo.open{display:flex;}
#md{background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 34px;width:100%;max-width:500px;border-top:2px solid #000;max-height:90vh;overflow-y:auto;}
.mh{width:36px;height:4px;border-radius:2px;background:#E2E8F0;margin:0 auto 16px;}
.mt{font-size:15px;font-weight:800;margin-bottom:14px;}
label{display:block;font-size:11px;color:#64748B;font-weight:700;margin-bottom:5px;}
input[type=text],textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #E2E8F0;background:#F8FAFC;font-size:14px;font-family:inherit;direction:rtl;outline:none;margin-bottom:12px;-webkit-appearance:none;}
textarea{resize:none;}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ts{display:flex;gap:6px;}
.ts select{flex:1;padding:9px 6px;}
.cr{display:flex;gap:9px;margin-bottom:14px;}
.cd{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.cd.sel{border:3px solid #1E293B;box-shadow:0 0 0 2px #fff;}
.br{display:flex;gap:8px;margin-top:4px;}
.bs{flex:1;padding:12px 0;border-radius:11px;border:none;background:#3B82F6;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;}
.bd{padding:12px 14px;border-radius:11px;border:1px solid #FCA5A5;background:#FEF2F2;color:#EF4444;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.bc{padding:12px 14px;border-radius:11px;border:1px solid #E2E8F0;background:#F8FAFC;color:#64748B;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;}
#dv{display:none;padding:0 12px 60px;}
#dv.vis{display:block;}
#cw.hid{display:none;}
.dtask{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;}
.dtask.done{opacity:.5;}.dtask.done .dtt{text-decoration:line-through;}
.dtc{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.dtt{font-size:15px;font-weight:700;margin-bottom:3px;}
.dtm{font-size:13px;color:#64748B;margin-bottom:2px;}
.dte{font-size:13px;color:#475569;}
.ddb{padding:6px 12px;border-radius:8px;border:1px solid #E2E8F0;background:#fff;color:#64748B;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;}
.ddb.chk{background:#10B981;border-color:#10B981;color:#fff;}
.drb{padding:6px 10px;border-radius:8px;border:1px solid #3B82F6;background:#EFF6FF;color:#3B82F6;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;}
.dri{width:100%;max-width:200px;border-radius:8px;margin-top:8px;border:1px solid #E2E8F0;cursor:pointer;}
.ri{display:none;}
#iv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;align-items:center;justify-content:center;flex-direction:column;}
#iv.open{display:flex;}
#iv img{max-width:95vw;max-height:85vh;border-radius:10px;object-fit:contain;}
#ivc{position:absolute;top:20px;left:20px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;}
#ap{display:none;position:fixed;inset:0;background:#fff;z-index:600;overflow-y:auto;padding:24px;}
#ap.open{display:block;}
.ah{font-size:18px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.acb{background:#F1F5F9;border:1px solid #E2E8F0;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.asec{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:16px;margin-bottom:16px;}
.ast{font-size:13px;font-weight:700;color:#475569;margin-bottom:12px;}
.ur{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F1F5F9;}
.ur:last-child{border-bottom:none;}
.ui{display:flex;align-items:center;gap:10px;}
.ua{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.un{font-size:14px;font-weight:700;}
.uc{font-size:11px;color:#94A3B8;}
.ur.disc .un{color:#94A3B8;text-decoration:line-through;}
.udb{padding:6px 12px;border-radius:8px;border:1px solid #FCA5A5;background:#FEF2F2;color:#EF4444;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.urb{padding:6px 12px;border-radius:8px;border:1px solid #BBF7D0;background:#F0FDF4;color:#10B981;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.fbb{width:100%;padding:12px;border-radius:11px;border:1px solid #E2E8F0;background:#F8FAFC;color:#475569;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
#factory-topbar{background:#fff;border-bottom:2px solid #e2e8f0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;}
.fb{display:grid;grid-template-columns:repeat(6,minmax(160px,1fr));height:calc(100vh - 90px);overflow-x:auto;overflow-y:hidden;}
.fc{display:flex;flex-direction:column;border-left:1px solid #e2e8f0;background:#fafafa;}
.fc.tod{background:#f0f4ff;}
.fch{padding:12px 10px 8px;border-bottom:2px solid #e2e8f0;background:#f1f5f9;position:sticky;top:0;z-index:2;}
.fc.tod .fch{border-bottom-color:#6366f1;background:#eef2ff;}
.fcb{flex:1;overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:7px;}
.fbl{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:9px 9px 7px;position:relative;}
.fpb{position:absolute;right:0;top:8px;bottom:8px;width:4px;border-radius:0 12px 12px 0;}
.fss{border:none;border-radius:6px;font-size:10px;font-weight:700;padding:3px 7px;cursor:pointer;outline:none;color:#fff;}
.fi{width:100%;background:#f8fafc;border:1px solid #e2e8f022;border-radius:7px;font-size:12px;padding:5px 8px;margin-top:4px;outline:none;box-sizing:border-box;font-family:inherit;direction:rtl;}
.fab{background:#fff;border:1.5px dashed #cbd5e1;border-radius:12px;color:#94a3b8;font-size:13px;font-weight:600;padding:9px 0;cursor:pointer;width:100%;margin-top:2px;}
.sp{border-radius:10px;padding:5px 12px;text-align:center;min-width:54px;}
</style>
</head>
<body>

<div id="pw-screen">
  <div class="pw-box">
    <div class="pw-sub">מגוון מערכות שילוט בע"מ<br><br>הכנס את הקוד האישי שלך</div>
    <input class="pw-input" id="pi" type="text" inputmode="numeric" placeholder="קוד" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="pw-btn" onclick="doLogin()">כניסה</button>
    <div class="pw-error" id="pe">קוד שגוי</div>
  </div>
</div>

<div id="home-screen">
  <div style="text-align:center;margin-bottom:28px;">
    <div id="hg" style="font-size:18px;color:#64748B;margin-top:4px;"></div>
  </div>
  <div class="home-card" onclick="openSchedule()">
    <div class="home-card-icon" style="background:#EFF6FF;">📋</div>
    <div><div class="home-card-title">רשימת התקנות</div><div class="home-card-desc">סידור עבודה שבועי</div></div>
    <span style="margin-right:auto;font-size:20px;color:#CBD5E1;">←</span>
  </div>
  <div class="home-card" id="fc-btn" onclick="openFactory()" style="display:none;">
    <div class="home-card-icon" style="background:#EEF2FF;">🏭</div>
    <div><div class="home-card-title">הזמנות ייצור</div><div class="home-card-desc">תוכנית ייצור שבועית</div></div>
    <span style="margin-right:auto;font-size:20px;color:#CBD5E1;">←</span>
  </div>
  <div class="home-card" id="admin-btn" onclick="showSetup()" style="display:none;background:#F8FAFC;">
    <div class="home-card-icon" style="background:#F1F5F9;">⚙️</div>
    <div><div class="home-card-title">ניהול מערכת</div><div class="home-card-desc">עובדים והגדרות</div></div>
    <span style="margin-right:auto;font-size:20px;color:#CBD5E1;">←</span>
  </div>
  <div class="home-logout" onclick="doLogout()">התנתק</div>
</div>

<div id="schedule-app">
  <div id="topbar">
    <div id="topbar-title">📋 רשימת התקנות מגוון <span id="sync-ind">⬤ לא מחובר</span></div>
    <div id="topbar-sub"></div>
    <div id="topbar-nav">
      <button class="nb" onclick="openAddTask()">+ הוסף משימה</button>
      <button class="nb" onclick="navWeek(-1)">← קודם</button>
      <button class="nb" id="tbtn" onclick="goToday()" style="display:none;background:rgba(59,130,246,.1);border-color:#3B82F6;color:#3B82F6;">היום</button>
      <button class="nb" onclick="navWeek(1)">הבא →</button>
      <button id="save-btn" onclick="doSave()">💾 שמור</button>
      <button class="nb" style="background:#1E293B;color:#fff;border-color:#1E293B;" onclick="goHome()">🏠 בית</button>
      <button class="nb act" id="bw" onclick="setView('w')">שבועי</button>
      <button class="nb" id="bd" onclick="setView('d')">יומי</button>
      <span id="ugb" style="font-size:13px;font-weight:700;padding:0 4px;"></span>
    </div>
  </div>
  <div id="cw"><div id="cal"><div id="day-headers"><div></div></div><div id="time-grid"><div id="hl-col" style="position:relative;"></div></div></div></div>
  <div id="dv"></div>
</div>

<div id="factory-app">
  <div id="factory-topbar">
    <div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:20px;font-weight:800;">תוכנית ייצור שבועית</span>
        <span style="background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff;border-radius:8px;font-size:11px;font-weight:700;padding:2px 10px;">ייצור</span>
      </div>
      <div style="display:flex;gap:12px;margin-top:3px;">
        <span id="fd" style="color:#64748b;font-size:12px;"></span>
        <span id="fs" style="font-size:11px;font-weight:600;color:#22c55e;">● מסונכרן</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button style="background:#6366f1;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:15px;padding:6px 14px;cursor:pointer;" onclick="fNav(-1)">הקודם →</button>
      <div style="text-align:center;min-width:110px;">
        <div id="fwl" style="font-size:13px;font-weight:700;color:#6366f1;"></div>
        <button id="ftb" onclick="fNav(0)" style="display:none;font-size:10px;color:#6366f1;background:none;border:none;cursor:pointer;font-weight:600;">חזור להיום</button>
      </div>
      <button style="background:#6366f1;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:15px;padding:6px 14px;cursor:pointer;" onclick="fNav(1)">← הבא</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="fsum" style="display:flex;gap:8px;"></div>
      <button style="background:#1E293B;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;" onclick="goHome()">🏠 בית</button>
    </div>
  </div>
  <div id="fb"></div>
</div>

<div id="ap">
  <div class="ah"><span>⚙️ ניהול מערכת</span><button class="acb" onclick="closeAdmin()">סגור ✕</button></div>
  <div class="asec"><div class="ast">👥 עובדים</div><div id="ul"></div></div>
  <div class="asec"><div class="ast">🔥 Firebase</div><button class="fbb" onclick="doFbSettings()">פתח הגדרות Firebase</button></div>
</div>

<div id="iv" onclick="this.classList.remove('open')">
  <button id="ivc" onclick="document.getElementById('iv').classList.remove('open')">✕</button>
  <img id="ivi" src="" alt="">
  <button onclick="event.stopPropagation();doPrint()" style="margin-top:16px;padding:10px 24px;border-radius:10px;border:none;background:#3B82F6;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">🖨️ הדפס</button>
</div>

<!-- MODAL - id="ttl" and id="emp" instead of old id="ft" and id="fe" to avoid window global conflicts -->
<div id="mo" onclick="if(event.target===this)this.classList.remove('open')">
  <div id="md">
    <div class="mh"></div>
    <div class="mt" id="mtitle">➕ משימה חדשה</div>
    <label>כותרת</label><input type="text" id="ttl">
    <label>עובד</label><input type="text" id="emp">
    <div class="tr">
      <div><label>שעת התחלה</label><div class="ts"><select id="sh"></select><select id="sm"></select></div></div>
      <div><label>שעת סיום</label><div class="ts"><select id="eh"></select><select id="em"></select></div></div>
    </div>
    <label>צבע</label><div class="cr" id="cr"></div>
    <label>הערה</label><textarea id="fn" rows="2"></textarea>
    <div class="br">
      <button class="bs" onclick="saveTask()">שמור</button>
      <button class="bd" id="delbtn" onclick="delTask()" style="display:none">מחק</button>
      <button class="bc" onclick="document.getElementById('mo').classList.remove('open')">ביטול</button>
    </div>
  </div>
</div>

<script>
var USERS={"2911":"מנהל","100":"ברק","101":"רועי","102":"כפיר","103":"איוון","104":"אבי","105":"יואל","106":"ג'סי"};
var ADMIN="2911";
var FA=["2911","100","105","106"];
var DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
var DKEYS=["sunday","monday","tuesday","wednesday","thursday","friday"];
var HOURS=[];for(var _h=7;_h<=19;_h++)HOURS.push(_h);
var HH=60;
var COLORS=[
  {bg:"#3B82F6",light:"rgba(59,130,246,.15)",border:"rgba(59,130,246,.5)"},
  {bg:"#10B981",light:"rgba(16,185,129,.15)",border:"rgba(16,185,129,.5)"},
  {bg:"#F59E0B",light:"rgba(245,158,11,.15)",border:"rgba(245,158,11,.5)"},
  {bg:"#EF4444",light:"rgba(239,68,68,.15)",border:"rgba(239,68,68,.5)"},
  {bg:"#8B5CF6",light:"rgba(139,92,246,.15)",border:"rgba(139,92,246,.5)"},
  {bg:"#EC4899",light:"rgba(236,72,153,.15)",border:"rgba(236,72,153,.5)"},
  {bg:"#06B6D4",light:"rgba(6,182,212,.15)",border:"rgba(6,182,212,.5)"}
];
var CCLOUD="dhywbsacy",CPRESET="migvan_unsigned";
var LSKEY="work_schedule_v3",LSCFG="firebase_cfg";

function pad(n){return String(n).padStart(2,"0");}
function gid(id){return document.getElementById(id);}
function getDisc(){try{return JSON.parse(localStorage.getItem("disc_users")||"[]");}catch(e){return[];}}
function saveDisc(a){localStorage.setItem("disc_users",JSON.stringify(a));}
function lsAll(){try{return JSON.parse(localStorage.getItem(LSKEY)||"{}");}catch(e){return{};}}
function lsLoad(k){return lsAll()[k]||null;}
function lsSave(k,d){var a=lsAll();a[k]=d;localStorage.setItem(LSKEY,JSON.stringify(a));}
function emptyTasks(){var s={};DKEYS.forEach(function(d){s[d]=[];});return s;}
function getWkDates(ref){var d=new Date(ref),sun=new Date(d);sun.setDate(d.getDate()-d.getDay());return DKEYS.map(function(_,i){var x=new Date(sun);x.setDate(sun.getDate()+i);return x;});}
function fmtD(d){return d.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});}

function initFb(cfg){
  try{
    var app=firebase.initializeApp({apiKey:cfg.apiKey,databaseURL:"https://"+cfg.projectId+"-default-rtdb.firebaseio.com"},"app"+Date.now());
    fbDb=firebase.database(app);fbRoom=cfg.room||"migvan";attachFbListener();
  }catch(e){console.error(e);setSyncStatus("err");}
}
function fbPath(){return"schedules/"+fbRoom+"/"+wkKey.replace(/ /g,"_");}
function setSyncStatus(s){
  var el=gid("sync-ind");if(!el)return;
  if(s==="ok"){el.style.background="rgba(16,185,129,.15)";el.style.color="#10B981";el.textContent="⬤ מסונכרן";}
  else if(s==="sync"){el.style.background="rgba(245,158,11,.15)";el.style.color="#F59E0B";el.textContent="↻ מסנכרן...";}
  else{el.style.background="#F1F5F9";el.style.color="#64748B";el.textContent="⬤ מקומי בלבד";}
}
function attachFbListener(){
  if(!fbDb||!fbRoom)return;
  if(fbListener){try{fbDb.ref(fbPath()).off("value",fbListener);}catch(e){}}
  setSyncStatus("sync");
  fbListener=fbDb.ref(fbPath()).on("value",function(snap){
    var data=snap.val();
    if(data&&!fbSyncing){tasks=data;lsSave(wkKey,tasks);if(curView==="d")renderDaily();else render();}
    setSyncStatus("ok");
  },function(){setSyncStatus("err");});
}
function pushFb(){
  if(!fbDb||!fbRoom)return;
  fbSyncing=true;
  fbDb.ref(fbPath()).set(tasks).catch(function(e){console.error(e);});
  setTimeout(function(){fbSyncing=false;},500);
}

        .catch(function(){alert("שגיאה בהעלאה");});

function toggleDone(day,id){
  tasks[day]=tasks[day].map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t;});
  if(curView==="d")renderDaily();else render();

}

function openEdit(task,day){

  gid("eh").value=task.endHour;gid("em").value=task.endMin;

  gid("delbtn").style.display="inline-block";
  var ds=gid("day-sel-row");if(ds)ds.remove();

function saveTask(){
  var title=gid("ttl").value.trim();if(!title){gid("ttl").focus();return;}
  var dayEl=gid("fday");var day=dayEl?dayEl.value:editDay;if(!day)return;
  var t={id:editId||genId(),title:title,employee:gid("emp").value.trim(),
    startHour:+gid("sh").value,startMin:+gid("sm").value,
    endHour:+gid("eh").value,endMin:+gid("em").value,
    color:selColor,note:gid("fn").value};
  if(!tasks[day])tasks[day]=[];
  if(editId){tasks[day]=tasks[day].map(function(x){return x.id===editId?t:x;});}
  else{tasks[day].push(t);}
  editDay=day;gid("mo").classList.remove("open");
  if(curView==="d")renderDaily();else render();
  if(fbDb)pushFb();else lsSave(wkKey,tasks);
}
function delTask(){
  if(!editId)return;
  tasks[editDay]=tasks[editDay].filter(function(x){return x.id!==editId;});
  gid("mo").classList.remove("open");
  if(curView==="d")renderDaily();else render();
  if(fbDb)pushFb();else lsSave(wkKey,tasks);
}

function goToday(){
  if(fbListener&&fbDb){try{fbDb.ref(fbPath()).off("value",fbListener);}catch(e){}}fbListener=null;
  wkDates=getWkDates(today);wkKey=wkDates[0].toDateString();
  tasks=lsLoad(wkKey)||emptyTasks();
  if(fbDb)attachFbListener();
  if(curView==="d")renderDaily();else render();
}
function doPrint(){var src=gid("ivi").src;var w=window.open("");w.document.write("<html><body style='margin:0'><img src='"+src+"' style='max-width:100%' onload='window.print();window.close()'></body></html>");w.document.close();}

var fOff=0,fBlocks={};
var FSTS=[{v:"open",l:"פתוח",c:"#ef4444",bg:"#fef2f2"},{v:"inprogress",l:"בביצוע",c:"#f97316",bg:"#fff7ed"},{v:"done",l:"הושלם",c:"#22c55e",bg:"#f0fdf4"}];
var FPRI=[{v:"high",l:"גבוהה",c:"#ef4444"},{v:"medium",l:"בינונית",c:"#f97316"},{v:"low",l:"נמוכה",c:"#22c55e"}];
var FBASE="factory-weekly-plan-v1";
function fSun(off){var t=new Date(),s=new Date(t);s.setDate(t.getDate()-t.getDay()+off*7);s.setHours(0,0,0,0);return s;}
function fDates(off){var s=fSun(off);return DAYS.map(function(_,i){var d=new Date(s);d.setDate(s.getDate()+i);return d.toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit"});});}
function fKey(off){return FBASE+"-"+fSun(off).toISOString().slice(0,10);}
function fWLabel(off){if(off===0)return"השבוע הנוכחי";if(off===1)return"השבוע הבא";if(off===-1)return"השבוע שעבר";return off>0?"בעוד "+off+" שבועות":"לפני "+Math.abs(off)+" שבועות";}
function fEmptyB(){return{id:Date.now()+"-"+Math.random().toString(36).slice(2),client:"",description:"",qty:"",status:"open",priority:"medium",notes:""};}
function fDef(){return DAYS.reduce(function(a,_,i){a[i]=[fEmptyB()];return a;},{});}
function fGetSt(v){return FSTS.find(function(s){return s.v===v;})||FSTS[0];}
function fGetPr(v){return FPRI.find(function(p){return p.v===v;})||FPRI[1];}
function fNav(dir){if(dir===0){fOff=0;}else{fOff+=dir;}renderFactory();}
async function renderFactory(){
  var key=fKey(fOff);
  if(!fBlocks[key]){
    try{var r=await window.storage.get(key,true);fBlocks[key]=JSON.parse(r.value);}
    catch(e){fBlocks[key]=fDef();}
  }
  var blks=fBlocks[key];var dates=fDates(fOff);var todayIdx=new Date().getDay();
  gid("fd").textContent=dates[0]+" – "+dates[5]+" | משמרת אחת";
  gid("fwl").textContent=fWLabel(fOff);gid("fwl").style.color=fOff===0?"#6366f1":"#334155";
  gid("ftb").style.display=fOff===0?"none":"block";
  var allB=Object.values(blks).flat();
  gid("fsum").innerHTML=["open","inprogress","done"].map(function(sv){var s=fGetSt(sv);return "<div class='sp' style='background:"+s.bg+";border:1.5px solid "+s.c+"55'><div style='font-size:18px;font-weight:800;color:"+s.c+"'>"+allB.filter(function(b){return b.status===sv&&b.client.trim();}).length+"</div><div style='font-size:10px;color:#64748b'>"+s.l+"</div></div>";}).join("");
  var board=gid("fb");board.innerHTML="";
  DAYS.forEach(function(day,di){
    var isT=fOff===0&&di===todayIdx;
    var col=document.createElement("div");col.className="fc"+(isT?" tod":"");
    var dayB=blks[di]||[fEmptyB()];
    var hdr=document.createElement("div");hdr.className="fch";
    hdr.innerHTML="<div style='display:flex;align-items:center;gap:6px;'><span style='font-weight:800;font-size:16px;color:"+(isT?"#4f46e5":"#334155")+"'>"+["א׳","ב׳","ג׳","ד׳","ה׳","ו׳"][di]+"</span><span style='font-weight:600;font-size:13px;color:"+(isT?"#6366f1":"#64748b")+"'>"+day+"</span>"+(isT?"<span style='background:#6366f1;color:#fff;border-radius:6px;font-size:9px;font-weight:700;padding:1px 6px;'>היום</span>":"")+"</div><div style='font-size:14px;font-weight:700;color:"+(isT?"#4f46e5":"#475569")+";margin-top:3px;'>"+dates[di]+"</div><div style='font-size:11px;color:#94a3b8;margin-top:1px;'>"+dayB.filter(function(b){return b.client;}).length+" הזמנות</div>";
    col.appendChild(hdr);
    var bDiv=document.createElement("div");bDiv.className="fcb";
    dayB.forEach(function(blk){
      var st=fGetSt(blk.status);var pr=fGetPr(blk.priority);
      var bEl=document.createElement("div");bEl.className="fbl";
      var pb=document.createElement("div");pb.className="fpb";pb.style.background=pr.c;bEl.appendChild(pb);
      bEl.innerHTML+="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;'><select class='fss' style='background:"+st.c+"' data-f='status' data-id='"+blk.id+"' data-di='"+di+"'>"+FSTS.map(function(s){return "<option value='"+s.v+"'"+(s.v===blk.status?" selected":"")+" style='color:#000;background:#fff'>"+s.l+"</option>";}).join("")+"</select><button style='background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:16px;' data-rm='"+blk.id+"' data-di='"+di+"'>×</button></div><input class='fi' style='border-color:#6366f155' placeholder='שם לקוח' value='"+blk.client+"' data-f='client' data-id='"+blk.id+"' data-di='"+di+"'><input class='fi' placeholder='תיאור עבודה' value='"+blk.description+"' data-f='description' data-id='"+blk.id+"' data-di='"+di+"'><input class='fi' placeholder='כמות' value='"+blk.qty+"' data-f='qty' data-id='"+blk.id+"' data-di='"+di+"'><div style='display:flex;gap:4px;align-items:center;margin-top:5px;'><span style='font-size:10px;color:#94a3b8;white-space:nowrap'>עדיפות:</span><select style='background:"+pr.c+";color:#fff;border:none;border-radius:6px;font-size:10px;font-weight:700;padding:3px 7px;flex:1;outline:none;cursor:pointer;' data-f='priority' data-id='"+blk.id+"' data-di='"+di+"'>"+FPRI.map(function(p){return "<option value='"+p.v+"'"+(p.v===blk.priority?" selected":"")+" style='color:#000;background:#fff'>"+p.l+"</option>";}).join("")+"</select></div><textarea class='fi' placeholder='הערות...' rows='2' data-f='notes' data-id='"+blk.id+"' data-di='"+di+"' style='resize:none;font-family:inherit;margin-top:4px;'>"+blk.notes+"</textarea>";
      bDiv.appendChild(bEl);
    });
    var addBtn=document.createElement("button");addBtn.className="fab";addBtn.textContent="+ הזמנה";
    (function(di2){addBtn.onclick=function(){if(!fBlocks[key][di2])fBlocks[key][di2]=[];fBlocks[key][di2].push(fEmptyB());fSave(key);renderFactory();};})(di);
    bDiv.appendChild(addBtn);col.appendChild(bDiv);board.appendChild(col);
  });
  board.onclick=function(e){
    var rm=e.target.closest("[data-rm]");
    if(rm){var di=+rm.dataset.di,id=rm.dataset.rm;fBlocks[key][di]=fBlocks[key][di].filter(function(b){return b.id!==id;});fSave(key);renderFactory();}
  };
  board.oninput=function(e){
    var el=e.target;if(!el.dataset.f)return;
    var di=+el.dataset.di,id=el.dataset.id;
    fBlocks[key][di]=fBlocks[key][di].map(function(b){return b.id===id?Object.assign({},b,{[el.dataset.f]:el.value}):b;});
    clearTimeout(board._t);board._t=setTimeout(function(){fSave(key);},800);
  };
}
function fSave(key){if(window.storage){window.storage.set(key,JSON.stringify(fBlocks[key]),true);}}

var _lm=null;
(function chk(){
  fetch(location.href,{method:"HEAD",cache:"no-cache"}).then(function(r){
    var m=r.headers.get("last-modified")||r.headers.get("etag");
    if(_lm===null){_lm=m;}else if(m&&m!==_lm){location.reload();}
  }).catch(function(){});
  setTimeout(chk,5*60*1000);
})();
</script>
